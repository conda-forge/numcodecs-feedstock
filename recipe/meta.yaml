{% set name = "numcodecs" %}
{% set version = "0.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e8db2e337bdafd3bb5f891a2543b53b2b36a509ce9d587af2846db3715b6c8b9

build:
  number: 0
  skip: true  # [py<312]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.1                           # [build_platform != target_platform]
    - meson-python >=0.17                    # [build_platform != target_platform]
    - meson >=1.6.0                          # [build_platform != target_platform]
    - setuptools-scm >=6.2                   # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - ninja
    - pkg-config
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - cython >=3.1
    - meson-python >=0.17
    - meson >=1.6.0
    - setuptools-scm >=6.2
    - numpy
  run:
    - python
    - numpy >=2.0
    - typing_extensions
    # Optional dependecy included for ease of use
    - msgpack-python

test:
  source_files:
    - tests
    - fixture
  requires:
    - importlib_metadata
    - pip
    - pytest
    - pyzstd
  imports:
    - numcodecs
    - numcodecs.blosc
    - numcodecs.lz4
    - numcodecs.zstd
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/zarr-developers/numcodecs
  license: MIT
  license_file: LICENSE.txt
  summary: A Python package providing buffer compression and transformation codecs for use in data storage and communication applications.

extra:
  recipe-maintainers:
    - d-v-b
    - alimanfoo
    - jakirkham
    - joshmoore
    - jrbourbeau
